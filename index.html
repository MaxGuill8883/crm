<!DOCTYPE html>
<html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM OS - Final Edition</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(18, 18, 18, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
            --text-dim: #71717a;
            --dev-bg: rgba(10, 10, 10, 0.99);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white; overflow: hidden;
        }

        /* BOUTON HOME */
        #auto-home-btn {
            position: fixed; top: 20px; left: 20px;
            width: 45px; height: 45px;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: none; align-items: center; justify-content: center;
            cursor: pointer; z-index: 9999; transition: 0.3s; color: white;
        }
        #auto-home-btn:hover { background: white; color: black; transform: scale(1.1); }

        #app-viewport {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            border: none; display: none; z-index: 9000; background: black;
        }

        .os-wrapper {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; transition: filter 0.4s;
        }

        .main-container { width: 950px; height: 600px; display: flex; gap: 20px; }

        .sidebar {
            width: 75px; background: var(--panel-bg);
            backdrop-filter: blur(30px); border: 1px solid var(--border-color);
            border-radius: 26px; display: flex; flex-direction: column;
            align-items: center; padding: 25px 0;
        }

        .user-profile-btn {
            width: 48px; height: 48px; border-radius: 16px;
            background: #222; border: 1px solid var(--border-color);
            margin-bottom: 35px; cursor: pointer; overflow: hidden;
        }
        .user-profile-btn img { width: 100%; height: 100%; object-fit: cover; }

        .nav-group { flex-grow: 1; display: flex; flex-direction: column; gap: 30px; }
        .nav-icon { color: var(--text-dim); cursor: pointer; transition: 0.3s; display: flex; justify-content: center; }
        .nav-icon.active, .nav-icon:hover { color: var(--accent); }

        .content-panel {
            flex-grow: 1; background: var(--panel-bg);
            backdrop-filter: blur(30px); border: 1px solid var(--border-color);
            border-radius: 30px; padding: 50px; position: relative;
        }

        .header { display: flex; align-items: center; margin-bottom: 40px; }
        .profile-pic { width: 80px; height: 80px; border-radius: 50%; margin-right: 25px; border: 2px solid var(--border-color); object-fit: cover; }
        
        .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-height: 350px; overflow-y: auto; }
        .card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
            padding: 24px; border-radius: 20px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
        }
        .card:hover { background: rgba(255,255,255,0.08); transform: translateY(-3px); }

        /* MODALS */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 420px; background: var(--dev-bg);
            border: 1px solid #333; border-radius: 24px; padding: 30px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
            display: none; z-index: 10000;
        }

        .modal-header { font-weight: 700; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; display: flex; justify-content: space-between; }
        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
        .field input, .field select { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 12px; border-radius: 12px; box-sizing: border-box;}
        
        .btn-primary { background: white; color: black; border: none; padding: 14px; width: 100%; border-radius: 12px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-secondary { background: transparent; color: white; border: 1px solid #444; padding: 12px; width: 100%; border-radius: 12px; cursor: pointer; margin-bottom: 10px; }
        .btn-export { background: #1a4d2e; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .btn-danger { background: #4a1a1a; color: #ff8a8a; border: none; padding: 10px; width: 100%; border-radius: 12px; cursor: pointer; margin-bottom: 10px;}

        .blur-active .os-wrapper { filter: blur(15px); pointer-events: none; }
    </style>
</head>
<body class="">

    <div id="auto-home-btn" onclick="closeApp()" style="display: none;"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="home" aria-hidden="true" class="lucide lucide-home"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div>
    <iframe id="app-viewport" src="about:blank" style="display: none;"></iframe>

    <div id="profileModal" class="modal" style="display: none;">
        <div class="modal-header"><span>👤 MON PROFIL</span><span style="cursor:pointer" onclick="closeModals()">×</span></div>
        <div class="field"><label>Nom d'utilisateur</label><input type="text" id="profName"></div>
        <div class="field"><label>URL de l'avatar</label><input type="text" id="profAvatar"></div>
        <button class="btn-primary" onclick="saveProfile()">Enregistrer le profil</button>
    </div>

    

    <div class="os-wrapper" style="display: flex;">
        <div class="main-container">
            <nav class="sidebar">
                <div class="user-profile-btn" onclick="openProfile()"><img id="sideAvatar" src="https://i.imgur.com/DVUV1JT.png"></div>
                <div class="nav-group">
                    <div class="nav-icon" onclick="switchTab('home', this)"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="layout-grid" aria-hidden="true" class="lucide lucide-layout-grid"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg></div>
                    <div class="nav-icon" onclick="switchTab('games', this)"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="gamepad-2" aria-hidden="true" class="lucide lucide-gamepad-2"><line x1="6" x2="10" y1="11" y2="11"></line><line x1="8" x2="8" y1="9" y2="13"></line><line x1="15" x2="15.01" y1="12" y2="12"></line><line x1="18" x2="18.01" y1="10" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"></path></svg></div>
                    <div class="nav-icon" onclick="switchTab('web', this)"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="globe" aria-hidden="true" class="lucide lucide-globe"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg></div>
                    <div class="nav-icon active" onclick="switchTab('nav', this)"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="compass" aria-hidden="true" class="lucide lucide-compass"><circle cx="12" cy="12" r="10"></circle><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"></path></svg></div>
                </div>
                
            </nav>

            <main class="content-panel">
                <div class="header">
                    <img id="mainAvatar" class="profile-pic" src="https://i.imgur.com/DVUV1JT.png">
                    <div class="user-meta">
                        <h2 id="userName">Default User</h2>
                        <p id="tabStatus">Tableau de bord</p>
                    </div>
                </div>
                <div id="contentGrid" class="links-grid"><div class="card"><span>Google</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="earth" aria-hidden="true" class="lucide lucide-earth"><path d="M21.54 15H17a2 2 0 0 0-2 2v4.54"></path><path d="M7 3.34V5a3 3 0 0 0 3 3a2 2 0 0 1 2 2c0 1.1.9 2 2 2a2 2 0 0 0 2-2c0-1.1.9-2 2-2h3.17"></path><path d="M11 21.95V18a2 2 0 0 0-2-2a2 2 0 0 1-2-2v-1a2 2 0 0 0-2-2H2.05"></path><circle cx="12" cy="12" r="10"></circle></svg></div><div class="card"><span>Bing</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="book-search" aria-hidden="true" class="lucide lucide-book-search"><path d="M11 22H5.5a1 1 0 0 1 0-5h4.501"></path><path d="m21 22-1.879-1.878"></path><path d="M3 19.5v-15A2.5 2.5 0 0 1 5.5 2H18a1 1 0 0 1 1 1v8"></path><circle cx="17" cy="18" r="3"></circle></svg></div><div class="card"><span>Wikipedia</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="globe" aria-hidden="true" class="lucide lucide-globe"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg></div></div>
            </main>
        </div>
    </div>

    <script id="dataScript">
        // TES CONTAINERS RÉCUPÉRÉS :
        let siteData = {
    "profile": {
        "name": "Default User",
        "avatar": "https://i.imgur.com/DVUV1JT.png"
    },
    "tabs": {
        "home": [
            {
                "label": "About Blank",
                "icon": "sticky-note",
                "link": "about_blank.html"
            },
            {
                "label": "Multi Tab",
                "icon": "copy",
                "link": "html_V2.html"
            }
        ],
        "games": [
            {
                "label": "Tuff Client",
                "icon": "pickaxe",
                "link": "https://test.tuffis.online"
            },
            {
                "label": "SandSpiel",
                "icon": "tree-palm",
                "link": "https://sandspiel.club"
            },
            {
                "label": "Polytrack",
                "icon": "car",
                "link": "https://htmlunblockedgames.github.io/pt0.6.0b1/"
            },
            {
                "label": "Hollow Knight",
                "icon": "sparkles",
                "link": "https://belcrafting.github.io/Hollow-Knight-HTML-port-/"
            }
        ],
        "web": [
            {
                "label": "Reine Marie",
                "icon": "school",
                "link": "https://www.reine-marie.qc.ca/"
            },
            {
                "label": "Pluriportail",
                "icon": "graduation-cap",
                "link": "https://portail.reine-marie.qc.ca/pluriportail/pfr/Main.srf?MainAccueil=1"
            },
            {
                "label": "Gmail",
                "icon": "mail",
                "link": "https://mail.google.com/"
            },
            {
                "label": "Studyo",
                "icon": "calendar",
                "link": "https://studyo.app/login"
            }
        ],
        "nav": [
            {
                "label": "Google",
                "icon": "earth",
                "link": "https://www.google.com/?igu=1"
            },
            {
                "label": "Bing",
                "icon": "book-search",
                "link": "https://bing.com/search?q=bing"
            },
            {
                "label": "Wikipedia",
                "icon": "globe",
                "link": "https://wikipedia.com"
            }
        ]
    }
};

        let currentTab = 'home';

        function updateUI() {
            document.getElementById('userName').innerText = siteData.profile.name;
            document.getElementById('mainAvatar').src = siteData.profile.avatar;
            document.getElementById('sideAvatar').src = siteData.profile.avatar;
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = "";
            (siteData.tabs[currentTab] || []).forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<span>${item.label}</span><i data-lucide="${item.icon || 'box'}"></i>`;
                card.onclick = () => launchApp(item.link);
                grid.appendChild(card);
            });
            lucide.createIcons();
            updateDevSelector();
        }

        function launchApp(url) {
            if (!url || url === "#") return;
            // Correction automatique des liens s'il manque le https
            let finalUrl = url;
            if (!url.startsWith('http') && !url.includes('.html')) {
                finalUrl = 'https://' + url;
            }
            const iframe = document.getElementById('app-viewport');
            iframe.src = finalUrl;
            iframe.style.display = 'block';
            document.getElementById('auto-home-btn').style.display = 'flex';
            document.querySelector('.os-wrapper').style.display = 'none';
        }

        function closeApp() {
            document.getElementById('app-viewport').src = "about:blank";
            document.getElementById('app-viewport').style.display = 'none';
            document.getElementById('auto-home-btn').style.display = 'none';
            document.querySelector('.os-wrapper').style.display = 'flex';
        }

        function openProfile() {
            document.getElementById('profileModal').style.display = 'block';
            document.getElementById('profName').value = siteData.profile.name;
            document.getElementById('profAvatar').value = siteData.profile.avatar;
            document.body.classList.add('blur-active');
        }

        function saveProfile() {
            siteData.profile.name = document.getElementById('profName').value;
            siteData.profile.avatar = document.getElementById('profAvatar').value;
            updateUI();
            closeModals();
        }

        function openDev() {
            document.getElementById('devModal').style.display = 'block';
            document.body.classList.add('blur-active');
            loadCardData();
        }

        function saveChanges() {
            const index = document.getElementById('cardSelector').value;
            if(siteData.tabs[currentTab][index]) {
                siteData.tabs[currentTab][index] = {
                    label: document.getElementById('devName').value,
                    icon: document.getElementById('devIcon').value,
                    link: document.getElementById('devLink').value
                };
                renderGrid();
            }
        }

        function addNewContainer() {
            siteData.tabs[currentTab].push({ label: "Nouveau", icon: "box", link: "#" });
            renderGrid();
        }

        function deleteContainer() {
            const index = document.getElementById('cardSelector').value;
            siteData.tabs[currentTab].splice(index, 1);
            renderGrid();
            loadCardData();
        }

        function loadCardData() {
            const index = document.getElementById('cardSelector').value;
            const item = siteData.tabs[currentTab][index];
            if(item) {
                document.getElementById('devName').value = item.label;
                document.getElementById('devIcon').value = item.icon;
                document.getElementById('devLink').value = item.link;
            }
        }

        function updateDevSelector() {
            const sel = document.getElementById('cardSelector');
            if(sel) sel.innerHTML = (siteData.tabs[currentTab] || []).map((item, i) => `<option value="${i}">${item.label}</option>`).join('');
        }

        function switchTab(tabKey, element) {
            currentTab = tabKey;
            document.querySelectorAll('.nav-icon').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
            renderGrid();
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            document.body.classList.remove('blur-active');
        }

        function exportHTML() {
            let exportDoc = document.documentElement.cloneNode(true);
            exportDoc.querySelector('body').classList.remove('blur-active');
            const dataString = "let siteData = " + JSON.stringify(siteData, null, 4) + ";";
            let scriptTag = exportDoc.querySelector('#dataScript');
            scriptTag.innerHTML = scriptTag.innerHTML.replace(/let siteData = \{[\s\S]*?\};/, dataString);
            
            const devModal = exportDoc.querySelector('#devModal');
            const devToggle = exportDoc.querySelector('#dev-toggle');
            if(devModal) devModal.remove();
            if(devToggle) devToggle.remove();

            const finalCode = "<!DOCTYPE html>\n" + exportDoc.outerHTML;
            const blob = new Blob([finalCode], { type: "text/html" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "CRM_OS_Final.html";
            a.click();
        }

        window.onload = updateUI;
    </script>

</body></html>
